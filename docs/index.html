<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Api_Clima</title>
  </head>
  <body>
    <div class="card">
      <div class="search-bar">
        <input
          type="text"
          placeholder="Ingrese la ciudad..."
          spellcheck="false"
        />
        <button>
          <img src="./src/assets/search.png" alt="foto boton buscar" />
        </button>
      </div>
      <div class="error">
        <p>Nombre de ciudad invalidad</p>
      </div>
      <div class="weather">
        <img
          src="./src/assets/rain.png"
          alt="foto del clima"
          class="weather-icon"
        />
        <h1 class="temp">23 &deg;C</h1>
        <h2 class="city">Lima</h2>
        <div class="details">
          <div class="col">
            <img src="./src/assets/humidity.png" alt="foto dee humedad" />
            <div class="legenda">
              <p class="humidity">50%</p>
              <p>Humedad</p>
            </div>
          </div>
          <div class="col">
            <img src="./src/assets/wind.png" alt="foto velocidad del viento" />
            <div class="legenda">
              <p class="wind">120Km/h</p>
              <p>Velocidad del viento</p>
            </div>
          </div>
        </div>
        <div class="detailsdos">
          <div class="col">
            <img src="./src/assets/feelLike.svg" alt="foto Sensación térmica" />
            <div class="legenda">
              <p class="feelLike">23 &deg;C</p>
              <p>Sensación térmica</p>
            </div>
          </div>

          <div class="col">
            <img src="./src/assets/barometro.svg" alt="foto barometro" />
            <div class="legenda">
              <p class="pressure">23 <small>(hPa)</small></p>
              <p>Presión a nivel del suelo</p>
            </div>
          </div>
        </div>

        <div class="detailstres">
          <div class="col">
            <img
              src="./src/assets/temp_max.svg"
              alt="foto temperatura máxima"
            />
            <div class="legenda">
              <p class="temp_max">23 &deg;C</p>
              <p>Temperatura máxima</p>
            </div>
          </div>
          <div class="col">
            <img
              src="./src/assets/temp_min.svg"
              alt="foto temperatura mínima"
            />
            <div class="legenda">
              <p class="temp_min">23 &deg;C</p>
              <p>Temperatura mínima</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
