<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Api_Clima</title>
  </head>
  <body>
    <div class="card">
      <div class="search-bar">
        <input
          type="text"
          placeholder="Ingrese la ciudad..."
          spellcheck="false"
        />
        <button><img src="./src/assets/search.png" alt="" /></button>
      </div>
      <div class="error">
        <p>Nombre de ciudad invalidad</p>
      </div>
      <div class="weather">
        <img src="./src/assets/rain.png" alt="" class="weather-icon" />
        <h1 class="temp">23 &deg;C</h1>
        <h2 class="city">Lima</h2>
        <div class="details">
          <div class="col">
            <img src="./src/assets/humidity.png" alt="" />
            <div>
              <p class="humidity">50%</p>
              <p>Humedad</p>
            </div>
          </div>
          <div class="col">
            <img src="./src/assets/wind.png" alt="" />
            <div>
              <p class="wind">120Km/h</p>
              <p>Velocidad del viento</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
